name: Build and deploy Caldova

on:
  push:
    branches:
      - main
      - "simulation/**"
    paths:
      - "src/**"
      - ".github/workflows/caldova-build-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: caldova-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build immutable images
        shell: bash
        run: |
          set -euo pipefail
          az acr build --registry "${{ vars.ACR_NAME }}" --image "caldova-portal:${GITHUB_SHA}" --file src/portal/Dockerfile src
          az acr build --registry "${{ vars.ACR_NAME }}" --image "caldova-api:${GITHUB_SHA}" --file src/api/Dockerfile src
          az acr build --registry "${{ vars.ACR_NAME }}" --image "caldova-api-latency:${GITHUB_SHA}" --file src/api/Dockerfile.latency src

      - name: Resolve immutable digests
        id: images
        shell: bash
        run: |
          set -euo pipefail
          login_server="$(az acr show --name "${{ vars.ACR_NAME }}" --query loginServer -o tsv)"
          portal_digest="$(az acr manifest show-metadata --registry "${{ vars.ACR_NAME }}" --name "caldova-portal:${GITHUB_SHA}" --query digest -o tsv)"
          api_digest="$(az acr manifest show-metadata --registry "${{ vars.ACR_NAME }}" --name "caldova-api:${GITHUB_SHA}" --query digest -o tsv)"
          latency_digest="$(az acr manifest show-metadata --registry "${{ vars.ACR_NAME }}" --name "caldova-api-latency:${GITHUB_SHA}" --query digest -o tsv)"
          echo "portal=${login_server}/caldova-portal@${portal_digest}" >> "$GITHUB_OUTPUT"
          echo "api=${login_server}/caldova-api@${api_digest}" >> "$GITHUB_OUTPUT"
          echo "latency=${login_server}/caldova-api-latency@${latency_digest}" >> "$GITHUB_OUTPUT"

      - name: Deploy selected revision
        shell: bash
        run: |
          set -euo pipefail
          portal_name="$(az containerapp list -g "${{ vars.AZURE_RESOURCE_GROUP }}" --query "[?starts_with(name, 'ca-caldova-portal-')].name | [0]" -o tsv)"
          api_name="$(az containerapp list -g "${{ vars.AZURE_RESOURCE_GROUP }}" --query "[?starts_with(name, 'ca-caldova-api-')].name | [0]" -o tsv)"
          test -n "$portal_name" && test -n "$api_name"
          az containerapp update -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "$portal_name" --image "${{ steps.images.outputs.portal }}" --output none
          az containerapp update -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "$api_name" --image "${{ steps.images.outputs.api }}" --output none
          echo "Healthy API artifact: ${{ steps.images.outputs.api }}"
          echo "Latency API artifact: ${{ steps.images.outputs.latency }}"

      - name: Verify health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 20 "${{ vars.CALDOVA_PUBLIC_ENDPOINT }}/health" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "Caldova did not return a healthy response after deployment." >&2
          exit 1
